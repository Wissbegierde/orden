<svg class="logo-svg" viewBox="67 20 315 240" xmlns="http://www.w3.org/2000/svg">
            <!-- C�rculo de fondo decorativo -->
            <circle cx="225" cy="140" r="120" fill="#FDB913" opacity="0.1"/>
            
            <!-- Ondas de sonido decorativas (fondo) -->
            <g opacity="0.2">
                <path d="M 225 140 Q 250 120, 275 140" stroke="#1E3A8A" stroke-width="3" fill="none"/>
                <path d="M 225 140 Q 260 110, 295 140" stroke="#1E3A8A" stroke-width="2" fill="none"/>
            </g>
            
            <!-- Gorra de tendero MEJORADA -->
            <g id="gorra-principal">
                <!-- Sombra de la gorra -->
                <ellipse cx="227" cy="162" rx="75" ry="16" fill="#000000" opacity="0.15"/>
                
                <!-- Visera -->
                <ellipse cx="225" cy="155" rx="75" ry="16" fill="#1E3A8A"/>
                <ellipse cx="225" cy="150" rx="75" ry="16" fill="#2563EB"/>
                <ellipse cx="225" cy="148" rx="70" ry="14" fill="#3B82F6"/>
                
                <!-- Corona principal -->
                <path d="M 160 150 Q 160 110, 225 98 Q 290 110, 290 150 Z" fill="#1E3A8A"/>
                <path d="M 165 150 Q 165 115, 225 103 Q 285 115, 285 150 Z" fill="#2563EB"/>
                
                <!-- Detalles de costuras -->
                <path d="M 180 135 Q 225 128, 270 135" stroke="#1E3A8A" stroke-width="1.5" fill="none" opacity="0.4"/>
                <path d="M 190 145 Q 225 140, 260 145" stroke="#1E3A8A" stroke-width="1.5" fill="none" opacity="0.4"/>
                
                <!-- Bot�n superior con brillo -->
                <circle cx="225" cy="103" r="10" fill="#FDB913"/>
                <circle cx="225" cy="103" r="8" fill="#FFD700"/>
                <circle cx="222" cy="101" r="3" fill="#FFFFFF" opacity="0.6"/>
            </g>
            
            <!-- Ondas de sonido ANIMADAS (derecha) -->
            <g id="ondas-derecha">
                <path d="M 300 130 Q 325 125, 350 130" stroke="#FDB913" stroke-width="7" fill="none" stroke-linecap="round">
                    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
                    <animate attributeName="stroke-width" values="7;5;7" dur="1.5s" repeatCount="indefinite"/>
                </path>
                <path d="M 305 142 Q 335 137, 365 142" stroke="#FDB913" stroke-width="6" fill="none" stroke-linecap="round">
                    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
                    <animate attributeName="stroke-width" values="6;4;6" dur="1.5s" repeatCount="indefinite"/>
                </path>
                <path d="M 310 154 Q 345 149, 380 154" stroke="#FDB913" stroke-width="5" fill="none" stroke-linecap="round">
                    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
                    <animate attributeName="stroke-width" values="5;3;5" dur="1.5s" repeatCount="indefinite"/>
                </path>
            </g>
            
            <!-- Ondas de sonido ANIMADAS (izquierda) -->
            <g id="ondas-izquierda">
                <path d="M 150 130 Q 125 125, 100 130" stroke="#FDB913" stroke-width="7" fill="none" stroke-linecap="round">
                    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
                    <animate attributeName="stroke-width" values="7;5;7" dur="1.5s" repeatCount="indefinite"/>
                </path>
                <path d="M 145 142 Q 115 137, 85 142" stroke="#FDB913" stroke-width="6" fill="none" stroke-linecap="round">
                    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
                    <animate attributeName="stroke-width" values="6;4;6" dur="1.5s" repeatCount="indefinite"/>
                </path>
                <path d="M 140 154 Q 105 149, 70 154" stroke="#FDB913" stroke-width="5" fill="none" stroke-linecap="round">
                    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
                    <animate attributeName="stroke-width" values="5;3;5" dur="1.5s" repeatCount="indefinite"/>
                </path>
            </g>
            
            <!-- Microondas adicionales (efecto de profundidad) -->
            <g opacity="0.4">
                <circle cx="340" cy="120" r="3" fill="#FDB913">
                    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle cx="110" cy="120" r="3" fill="#FDB913">
                    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
                    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0.5s"/>
                </circle>
            </g>
        </svg>
